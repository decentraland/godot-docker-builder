name: build-upload quay

on:
  push:
    branches:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: bigrunner
    steps:
    - uses: actions/checkout@v2
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      id: build-image
      uses: redhat-actions/buildah-build@v2
      with:
        image: dcl-godot-android-builder
        tags: ${{ github.sha }} ${{ inputs.docker-tag }}
        dockerfiles: |
          ./godot-android.Dockerfile
        build-args: |
          ${{ inputs.build-args }}
          COMMIT_HASH=${{ github.sha }}

    - name: Build Docker Image with Rust
      id: build-image-rust
      uses: redhat-actions/buildah-build@v2
      with:
        image: dcl-godot-android-builder-rust
        tags: ${{ github.sha }} ${{ inputs.docker-tag }}
        dockerfiles: |
          ./godot-android-with-rust.Dockerfile
        build-args: |
          ${{ inputs.build-args }}
          COMMIT_HASH=${{ github.sha }}

    - name: Push To quay.io
      id: push-to-quay
      uses: redhat-actions/push-to-registry@v2
      with:
        image: ${{ steps.build-image.outputs.image }}
        tags: ${{ steps.build-image.outputs.tags }}
        registry: quay.io/decentraland
        username: ${{ secrets.QUAY_USERNAME }}
        password: ${{ secrets.QUAY_TOKEN }}

    - name: Push To quay.io with Rust
      id: push-to-quay-rust
      uses: redhat-actions/push-to-registry@v2
      with:
        image: ${{ steps.build-image-rust.outputs.image }}
        tags: ${{ steps.build-image-rust.outputs.tags }}
        registry: quay.io/decentraland
        username: ${{ secrets.QUAY_USERNAME }}
        password: ${{ secrets.QUAY_TOKEN }}

    # ghcr.io is on GitHub's network: the 5 GB image pulls in ~1 min from a GitHub-hosted runner
    # (godot-explorer's Android CI), vs ~5 min from quay.io.
    - name: Push To ghcr.io
      uses: redhat-actions/push-to-registry@v2
      with:
        image: ${{ steps.build-image.outputs.image }}
        tags: ${{ steps.build-image.outputs.tags }}
        registry: ghcr.io/decentraland
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push To ghcr.io with Rust
      uses: redhat-actions/push-to-registry@v2
      with:
        image: ${{ steps.build-image-rust.outputs.image }}
        tags: ${{ steps.build-image-rust.outputs.tags }}
        registry: ghcr.io/decentraland
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Print image url
      run: echo "Image pushed to ${{ steps.push-to-quay.outputs.registry-paths }} and ${{ steps.push-to-quay-rust.outputs.registry-paths }}"